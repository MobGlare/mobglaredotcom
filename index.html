<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobGlare.com</title>
</head>
<body>
    <header>
        <center><h1 class="title">MobGlare.com</h1></center>
    </header>
    <nav id="navbar">
        <div class="nav-links">
            <a href="/projects">Projects</a>
            <!-- <a href="/settings">Settings</a> -->
        </div>
    </nav>
    <main>
        <section id="about">
            <p class="text">Personal website of MobGlare, where I put random stuff I make like the clock below</p>
        </section>
        <section id="clock-box">
            <div id="clock-content">
                <div id="clock">
                    <div id="clock-button"><button>Clock it</button></div>
                    <div class="hand hour"></div>
                    <div class="hand minute"></div>
                    <div class="hand second"></div>
                    <div class="center-dot"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <footer id="footer">
        <div class="footer-links">
            <a href="https://github.com/MobGlare/mobglaredotcom" class="footertext">Source</a>
            <!-- <a href="/contacts">Contact Me</a> -->
        </div>
    </footer>
      
</body>
</html>
